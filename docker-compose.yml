services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nhazi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhazi"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies Prisma migrations, then exits.
  migrate:
    build: &app-build
      context: .
      args:
        NEXT_PUBLIC_AUTH_DEV_BYPASS: ${NEXT_PUBLIC_AUTH_DEV_BYPASS:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    image: handly-app
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nhazi
    depends_on:
      db:
        condition: service_healthy

  app:
    build: *app-build
    image: handly-app
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides .env: inside the network the DB host is `db`, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nhazi
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
